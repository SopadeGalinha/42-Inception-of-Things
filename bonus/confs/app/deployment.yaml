apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-app
  namespace: dev
  labels:
    app: color-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: color-app
  template:
    metadata:
      labels:
        app: color-app
    spec:
      containers:
        - name: color-app
          image: hmacielp/color-app:1.0.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: color-app-service
  namespace: dev
  labels:
    app: color-app
spec:
  type: ClusterIP
  selector:
    app: color-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
